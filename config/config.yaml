# Central config. Every path and threshold lives here, nothing is hardcoded in code.
# Paths are relative to the repo root unless absolute.

samples: config/samples.tsv
results_dir: results
data_dir: data

# --- Raw data -> counts (HPC only) --------------------------------------------
cellranger:
  bin: cellranger                       # or /burg/home/<uni>/cellranger-9.0.1/cellranger
  transcriptome: /path/to/refdata-gex-GRCm39-2024-A
  cores: 8
  mem_gb: 64
  create_bam: true                      # keep BAMs: needed for RNA velocity later

velocity:
  enabled: false                        # stretch goal; needs BAMs + GTF
  gtf: /path/to/refdata-gex-GRCm39-2024-A/genes/genes.gtf.gz

# --- Metadata derived from the `treatment` column ----------------------------
treatment_metadata:
  PBS:  {bacSpecies: "NA", Gram: "NA"}
  PAO1: {bacSpecies: Pa,  Gram: Neg}
  CS17: {bacSpecies: Pa,  Gram: Neg}
  Sa:   {bacSpecies: Sa,  Gram: Pos}
  Kp:   {bacSpecies: Kp,  Gram: Neg}

# --- QC ------------------------------------------------------------------------
qc:
  mode: mad            # "mad" = per-sample adaptive (recommended), "fixed" = Griffin's original cutoffs
  min_cells_per_gene: 3
  hard_min_genes: 200  # always applied (both modes)

  fixed:               # reproduces CreateObject/Integration.R
    max_pct_mt: 7.5
    min_counts: 1000
    min_genes: 200

  mad:
    nmads_counts: 5    # on log1p(total_counts), both tails
    nmads_genes: 5     # on log1p(n_genes), both tails
    nmads_mt: 3        # upper tail only
    max_pct_mt_ceiling: 15   # never keep cells above this, even if MAD allows

  max_pct_hb: 5        # red blood cell / hemoglobin contamination (set null to disable)

  mt_prefix: "mt-"
  hb_regex: "^Hb[ab]-"

# Marker genes used only for QC diagnostics (not for filtering)
checks:
  neutrophil_markers: [Csf3r, S100a8, S100a9, Retnlg, Cxcr2, Mmp9, Lcn2]
  neutrophil_score_quantile: 0.9   # cells above this score quantile = "putative neutrophils"
  female_genes: [Xist]
  male_genes: [Ddx3y, Eif2s3y, Kdm5d, Uty]

# --- Doublets ------------------------------------------------------------------
doublets:
  method: scrublet     # scanpy.pp.scrublet, run per sample
  expected_rate: 0.06
  remove: true

# --- Merge / normalize / integrate / cluster -------------------------------------
processing:
  n_top_genes: 3000
  normalization: lognorm       # "lognorm" or "pearson_residuals" (closest to SCTransform v2)
  n_pcs: 50
  integration: harmony         # "harmony", "none" (scVI planned as an option)
  batch_key: sample
  n_neighbors: 30
  neighbor_pcs: 30
  leiden_resolution: 0.4
  seed: 112357

# --- Annotation ------------------------------------------------------------------
# Griffin's final marker lists (email 2026-10-09; "# Current lists" in Annotation.R).
# Each Leiden cluster gets the cell type whose markers score highest (sc.tl.score_genes).
# Low-margin calls are flagged for manual review, not trusted blindly.
annotation:
  enabled: true
  min_margin: 0.1          # top score minus runner-up; below this the call is flagged "check"
  markers:
    AM: [Siglecf, Pparg, Ear1, Krt79, Car4]
    BCell: [Ly6d, Cd79a, Cd79b, Cd19, Pax5]
    Neu: [Csf3r, Mmp9, Cxcr2, S100a8, Lcn2]
    Mega: [Ppbp, Nrgn, Clec1b, Alox12, Gp9]
    MoMac: [Ly6c2, Ccr2, Fn1, Vcan, Ms4a4c]
    NK: [Ncr1, Gzma, Gzmb, Nkg7, Klrb1c]
    ILC: [Gata3, Calca, Il1rl1, Emb, Il7r]
    TCell: [Trbc2, Cd3g, Cd3d, Trac, Cd4, Cd8a]
    EC: [Cldn5, Ramp2, Lyve1, Pecam1, Ldb2, Ptprm]
    Col13a1Fibro: [Col13a1, Itga8, Cxcl14, Npnt, Col1a2]
    Col14a1Fibro: [Col14a1, Pi16, Mmp3, Cygb, Meg3]
    SMC: [Lmod1, Actg2, Acta2, Cnn1, Myh11]
    cDC1: [Itgae, Xcr1, Clec9a, Wdfy4, Flt3]
    cDC2: [Cd209a, S100a4, Clec10a, Irf4, H2-Ab1]
    migDC: [Ccr7, Fscn1, Ccl17, Ccl22]
    AT2: [Sftpa1, Sftpb, Sftpc, Sftpd, Lyz2]
    IM: [C1qa, C1qb, C1qc, Csf1r, Mafb]
    ncMo: [Hgf, Nr4a1, Cebpb]
    AT1: [Scnn1g, Hopx, Ager, Gramd2, Aqp5]
    Meso: [Igfbp5, Igfbp6, Rarres2, Gpc3, Msln]
    Cil: [Cdhr3, Dynlrb2, Cfap126, Ccdc153, Foxj1]
    Club: [Scgb3a2, Scgb1a1, Wfdc2, Cbr2]
    NKT: [Cd3e, Klrk1, Klrc2]
    moDC: [Fcgr1, Mertk, Fcer1g]
    myoFibro: [Hhip, Aspn, Mustn1, Tagln, Scx]
    Peri: [Gucy1b1, Pde5a, Higd1b, Pdgfrb, Cspg4]
    Oligo: [Sox10, Plp1, Cnp, Mbp, Ncam1]
  coarse:                  # finer labels that collapse at the coarse level
    Col13a1Fibro: Fibro
    Col14a1Fibro: Fibro
    cDC1: DC
    cDC2: DC
    migDC: DC
    moDC: DC
