[project]
name = "lungsc"
version = "0.1.0"
description = "Preprocessing for the Prince lab 3-species lung scRNA-seq data"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
